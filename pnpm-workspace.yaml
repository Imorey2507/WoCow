# WoCow · pnpm workspace + settings
#
# Since pnpm 10, dependency install scripts are blocked by default — a
# supply-chain defence, because a malicious package can run arbitrary code
# from its postinstall. esbuild (which Vite depends on) genuinely needs its
# postinstall to place the correct platform binary, so it is allow-listed
# here, explicitly, by name.
#
# Never set a package to true here without knowing what its install script
# does. If `pnpm install` reports ERR_PNPM_IGNORED_BUILDS, read that package's
# install script before adding it.

allowBuilds:
  esbuild: true

# Optional: pnpm 11 records which packages were reviewed.
ignoredBuiltDependencies: []
