# Aggie Playground — continuous integration
#
# SCOPE: the official WoCow submission app only, in aggie-playground/.
# The Vite app at the repository root is a frozen backup and is deliberately
# not built here — see README.md.
#
# Uses npm (not pnpm) because aggie-playground/package-lock.json is the
# authoritative lockfile for this app, committed by its author.

name: CI (Aggie Playground)

on:
  push:
    branches: [main]
    paths:
      - "aggie-playground/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "aggie-playground/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-aggie-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: aggie-playground

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aggie-playground/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Placeholders so the "Supabase is configured" branch is compiled
          # too. Without these, `supabaseConfigured` folds to `false` at build
          # time and the configured code path is tree-shaken away, so CI would
          # stop catching errors in it. Real values live in Vercel, never here.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
