# WoCow · continuous integration
#
# Runs on every pull request so Person 5 never has to check out someone's
# branch to find out whether it compiles. Keep this green and main stays
# deployable.
#
# The three steps mirror the local commands exactly:
#   pnpm typecheck   == tsc --noEmit
#   pnpm test        == vitest run
#   pnpm build       == tsc --noEmit && vite build

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run when someone pushes again to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Placeholder values so the build succeeds without real secrets.
          # Vite inlines these at build time; the app gates on
          # isSupabaseConfigured. Put real values in Vercel, not here.
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

      - name: Upload the build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5
